<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給与シミュレーター</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --gray: #333333;
      --gold: #d4af37;
      --text: #ffffff;
      --text-sub: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans JP', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding-bottom: 50px;
      display: none;
    }

    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--gray);
      margin-bottom: 20px;
    }
    .header h1 {
      color: var(--gold);
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: var(--gray);
      border: 1px solid #444;
      color: var(--text-sub);
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    #tab-btn-manager {
      display: none;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      margin-bottom: 20px;
    }
    .card-title {
      color: var(--gold);
      font-size: 0.9rem;
      margin-bottom: 15px;
      border-left: 3px solid var(--gold);
      padding-left: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid var(--gray);
      padding: 12px;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .calc-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }
    .calc-btn:hover {
      background: var(--gold);
      color: #000;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .result-row:last-child {
      border-bottom: none;
      margin-top: 10px;
      padding-top: 15px;
    }
    .result-label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .result-val {
      font-size: 1rem;
      font-weight: bold;
    }
    .result-val.total {
      font-size: 1.4rem;
      color: var(--gold);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--gray);
      border-top: 3px solid var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    #loading p {
      font-size: 0.8rem;
      color: var(--gold);
    }

    #checking-auth {
      text-align: center;
      margin-top: 100px;
      color: var(--gold);
    }
    #auth-error {
      display: none;
      text-align: center;
      margin-top: 100px;
      color: #ff4444;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="checking-auth">
  <div class="spinner"></div>
  <p>ユーザー権限を確認中...</p>
</div>

<div id="auth-error">
  <p>🔒 アクセス権限がありません。<br><span style="font-size:0.85rem; font-weight:normal; color:#aaa;">スタッフマスタにLINEの連携登録が必要です。</span></p>
</div>

<div class="container" id="main-app">
  <div class="header">
    <h1 id="welcome-title">給与シミュレーター</h1>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" id="tab-btn-contract" onclick="switchType('委託')">業務委託</button>
    <button class="tab-btn" id="tab-btn-regular" onclick="switchType('正社員')">正社員</button>
    <button class="tab-btn" id="tab-btn-manager" onclick="switchType('管理者')">店舗管理者</button>
  </div>

  <div class="card">
    <div class="card-title">シミュレーション条件入力</div>
    
    <div class="form-group" id="group-store-select" style="display: none;">
      <label>対象店舗</label>
      <select id="val-store-select">
        <option value="annee">annee</option>
        <option value="yoki.">yoki.</option>
      </select>
    </div>

    <div class="form-group" id="group-emp-grade" style="display: none;">
      <label>職級</label>
      <select id="val-emp-grade" onchange="calcRealtime()">
        <option value="assistant">アシスタント（カラー合格前）</option>
        <option value="jr-stylist">Jrスタイリスト（カット合格前）</option>
        <option value="stylist" selected>スタイリスト</option>
      </select>
    </div>

    <div class="form-group" id="group-shimei">
      <label>指名技術売上 (円)</label>
      <input type="number" id="val-shimei" value="0" oninput="calcRealtime()">
    </div>

    <div class="form-group" id="group-free">
      <label>フリー技術売上 (円)</label>
      <input type="number" id="val-free" value="0" oninput="calcRealtime()">
    </div>

    <div class="form-group" id="group-staff-count" style="display: none;">
      <label>スタッフ数 (人)</label>
      <input type="number" id="val-staff-count" value="0">
    </div>
    
    <div class="form-group" id="group-store-sales" style="display: none;">
      <label>店舗総売上 (円)</label>
      <input type="number" id="val-store-sales" value="0">
    </div>

    <div class="form-group" id="group-my-sales" style="display: none;">
      <label>自身の売上 (円)</label>
      <input type="number" id="val-my-sales" value="0">
    </div>

    <div class="form-group" id="group-tenba">
      <label>店販売上 (円)</label>
      <input type="number" id="val-tenba" value="0" oninput="calcRealtime()">
    </div>

    <div class="form-group" id="group-work-hours">
      <label>稼働時間 (時間)</label>
      <input type="number" id="val-work-hours" value="0" oninput="calcRealtime()">
    </div>
    <div class="form-group" id="group-task-hours">
      <label>作業時間 (時間・0.5刻み)</label>
      <input type="number" id="val-task-hours" step="0.5" value="0" oninput="calcRealtime()">
    </div>

    <div class="form-group" id="group-total-hours" style="display: none;">
      <label>総労働時間 (時間)</label>
      <input type="number" id="val-total-hours" value="0" oninput="calcRealtime()">
    </div>

    <div class="form-group" id="group-traffic">
      <label>交通費申請額 (円)</label>
      <input type="number" id="val-traffic" value="0" oninput="calcRealtime()">
    </div>

    <button class="calc-btn" id="btn-calc-manager" style="display: none;" onclick="calcManagerWithSpreadsheet()">店舗利益を連動して計算</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>スプレッドシートの数式と連動中...</p>
  </div>

  <div class="card">
    <div class="card-title">給与支給見込み（試算結果）</div>
    <div id="result-box"></div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwBvIo3dwUlJxokcDr2KQjJ2w4RcqkOFjwt1Hlnq4YBDKGooxtnwqz2xOUKdPptwSIg/exec"; 
  const LIFF_ID = "2010338156-BlUG050h"; 

  let currentType = '委託';
  let userLineId = "";
  let hasManagerAccess = false; 
  let myKakeiAllowance = 0; 

  window.onload = function() {
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            userLineId = profile.userId;
            checkUserAuthority(userLineId);
          });
        }
      })
      .catch(err => { console.error("LIFF Init Error", err); });
  };

  async function checkUserAuthority(userId) {
    try {
      const response = await fetch(`${GAS_URL}?action=checkAuth&userId=${userId}`);
      const result = await response.json();
      
      document.getElementById('checking-auth').style.display = 'none';
      
      if (result.status === 'success' && result.isAllowed) {
        document.getElementById('main-app').style.display = 'block'; 
        
        // マスタから自動算出された係手当の総額をキープ
        myKakeiAllowance = Number(result.kakeiAllowance) || 0;
        
        if (result.isManager) {
          hasManagerAccess = true;
          document.getElementById('tab-btn-manager').style.display = 'block';
          setupSwipeGesture(); 
        }
        
        calcRealtime(); 
      } else {
        document.getElementById('auth-error').style.display = 'block'; 
      }
    } catch (e) {
      document.getElementById('checking-auth').style.display = 'none';
      document.getElementById('auth-error').style.display = 'block';
    }
  }

  function switchType(type) {
    currentType = type;
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (type === '委託') document.getElementById('tab-btn-contract').classList.add('active');
    if (type === '正社員') document.getElementById('tab-btn-regular').classList.add('active');
    if (type === '管理者') document.getElementById('tab-btn-manager').classList.add('active');

    // 出し分け制御
    document.getElementById('group-store-select').style.display  = (type === '管理者') ? 'block' : 'none';
    document.getElementById('group-store-sales').style.display   = (type === '管理者') ? 'block' : 'none';
    document.getElementById('group-staff-count').style.display   = (type === '管理者') ? 'block' : 'none';
    document.getElementById('group-my-sales').style.display      = (type === '管理者') ? 'block' : 'none';
    document.getElementById('btn-calc-manager').style.display    = (type === '管理者') ? 'block' : 'none';

    document.getElementById('group-emp-grade').style.display     = (type === '正社員') ? 'block' : 'none';
    document.getElementById('group-total-hours').style.display   = (type === '正社員') ? 'block' : 'none';

    document.getElementById('group-work-hours').style.display    = (type === '委託') ? 'block' : 'none';
    document.getElementById('group-task-hours').style.display    = (type === '委託') ? 'block' : 'none';

    document.getElementById('group-shimei').style.display        = (type !== '管理者') ? 'block' : 'none';
    document.getElementById('group-free').style.display          = (type !== '管理者') ? 'block' : 'none';
    document.getElementById('group-tenba').style.display         = (type !== '管理者') ? 'block' : 'none';
    document.getElementById('group-traffic').style.display       = (type !== '管理者') ? 'block' : 'none';

    calcRealtime();
  }

  function calcRealtime() {
    if (currentType === '管理者') {
      document.getElementById('result-box').innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem; text-align:center;">「店舗利益を連動して計算」ボタンを押すと、スプレッドシートの数式と連動した計算結果が表示されます。</p>`;
      return; 
    }

    const shimei = Number(document.getElementById('val-shimei').value) || 0;
    const free = Number(document.getElementById('val-free').value) || 0;
    const tenba = Number(document.getElementById('val-tenba').value) || 0;
    const traffic = Number(document.getElementById('val-traffic').value) || 0;

    let html = "";
    let total = 0;

    if (currentType === '委託') {
      const hours = Number(document.getElementById('val-work-hours').value) || 0;
      const taskHours = Number(document.getElementById('val-task-hours').value) || 0;

      const rShimei = Math.floor(shimei * 0.5);
      const rFree = Math.floor(free * 0.4);
      
      const bonusBase = (shimei + free) - 1000000;
      const rBonus = bonusBase > 0 ? Math.floor(bonusBase * 0.2) : 0;
      
      const rTenba = Math.floor(tenba * 0.1);
      const rTask = Math.floor(taskHours * 1500);

      // ⭕️ 交通費支給判定（0.5時間刻み対応）
      let rTraffic = 0;
      if (hours >= 200) {
        rTraffic = Math.min(traffic, 22000);
      } else if (hours >= 150) {
        rTraffic = Math.min(traffic, 11000);
      } else if (hours >= 100) {
        rTraffic = Math.min(traffic, 5500);
      } else {
        rTraffic = 0;
      }

      const rKakei = myKakeiAllowance; 

      total = rShimei + rFree + rBonus + rTenba + rTask + rTraffic + rKakei;

      html = `
        <div class="result-row"><span class="result-label">指名売上報酬 (50%)</span><span class="result-val">¥${rShimei.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">フリー売上報酬 (40%)</span><span class="result-val">¥${rFree.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">ボーナス報酬 (超過20%)</span><span class="result-val">¥${rBonus.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">店販報酬 (10%)</span><span class="result-val">¥${rTenba.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">作業時間手当 (¥1,500/h)</span><span class="result-val">¥${rTask.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">係手当</span><span class="result-val">¥${rKakei.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">交通費</span><span class="result-val">¥${rTraffic.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">支給見込み総額</span><span class="result-val total">¥${total.toLocaleString()}</span></div>
      `;
    } 
    else if (currentType === '正社員') {
      const grade = document.getElementById('val-emp-grade').value;
      const totalHours = Number(document.getElementById('val-total-hours').value) || 0;

      let basePay = 230700;
      if (grade === 'assistant') basePay = 213000;
      if (grade === 'jr-stylist') basePay = 215700;

      const overtime = totalHours - 177;
      const rOvertime = overtime > 0 ? Math.floor(overtime * 1625) : 0;
      const rTraffic = Math.min(traffic, 20000);
      const rTenba = Math.floor(tenba * 0.1);

      let rSalesPay = 0;
      const techTotal = shimei + free;
      if (techTotal > 550000) {
        const overSales = techTotal - 550000;
        const shimeiRate = shimei / techTotal;
        const freeRate = free / techTotal;
        rSalesPay = Math.floor((overSales * shimeiRate * 0.4) + (overSales * freeRate * 0.2));
      }

      total = basePay + rOvertime + rTraffic + rTenba + rSalesPay + myKakeiAllowance;

      html = `
        <div class="result-row"><span class="result-label">基本給</span><span class="result-val">¥${basePay.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">残業手当 (177h超分)</span><span class="result-val">¥${rOvertime.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">売上按分報酬 (閾値55万)</span><span class="result-val">¥${rSalesPay.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">店販報酬 (10%)</span><span class="result-val">¥${rTenba.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">係手当</span><span class="result-val">¥${myKakeiAllowance.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">交通費 (上限2万)</span><span class="result-val">¥${rTraffic.toLocaleString()}</span></div>
        <div class="result-row"><span class="result-label">支給見込み総額</span><span class="result-val total">¥${total.toLocaleString()}</span></div>
      `;
    }

    document.getElementById('result-box').innerHTML = html;
  }

  function calcManagerWithSpreadsheet() {
    const store = document.getElementById('val-store-select').value;
    const storeSales = Number(document.getElementById('val-store-sales').value) || 0;
    const staffCount = Number(document.getElementById('val-staff-count').value) || 1;
    const mySales = document.getElementById('val-my-sales').value; 

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result-box').innerHTML = "";

    fetch(`${GAS_URL}?action=simulate&store=${store}&storeSales=${storeSales}&mySales=${mySales}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        
        if (data.status === 'success') {
          const finalProfit = Math.round(data.storeProfit);
          const finalSalary = Math.max(Math.round(data.calculatedSalary), 400000);
          const productivity = Math.round(storeSales / staffCount);

          document.getElementById('result-box').innerHTML = `
            <div class="result-row"><span class="result-label">生産性(目安)</span><span class="result-val">¥${productivity.toLocaleString()}</span></div>
            <div class="result-row"><span class="result-label">対象店舗利益</span><span class="result-val">¥${finalProfit.toLocaleString()}</span></div>
            <div class="result-row"><span class="result-label">支給見込み額</span><span class="result-val total">¥${finalSalary.toLocaleString()}</span></div>
          `;
        } else {
          document.getElementById('result-box').innerHTML = `<p style="color:red;">エラー: ${data.message}</p>`;
        }
      })
      .catch(err => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result-box').innerHTML = `<p style="color:red;">通信エラーが発生しました</p>`;
      });
  }

  function setupSwipeGesture() {
    let touchstartX = 0;
    let touchendX = 0;
    const types = ['委託', '正社員', '管理者'];
    
    window.addEventListener('touchstart', e => {
      touchstartX = e.changedTouches[0].screenX;
    });
    
    window.addEventListener('touchend', e => {
      touchendX = e.changedTouches[0].screenX;
      handleSwipe();
    });
    
    function handleSwipe() {
      const swipeDistance = touchendX - touchstartX;
      let idx = types.indexOf(currentType);
      
      if (Math.abs(swipeDistance) > 60) {
        if (swipeDistance < 0) {
          idx++;
          if (!hasManagerAccess && idx > 1) idx = 1;
          if (idx >= types.length) idx = types.length - 1;
        } else {
          idx--;
          if (idx < 0) idx = 0;
        }
        switchType(types[idx]);
      }
    }
  }
</script>
</body>
</html>
